name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by a FULL version tag, never by a floating major
      # (ADR-0086). `@v7.0.1`, never `@v7`: the floating form is what silently
      # changed the bundled linter under this workflow once already, and the
      # guardrail rejects it. The residual risk this accepts is stated in the
      # ADR: a release tag is still movable by whoever owns the action.
      - uses: actions/checkout@v7.0.1
      - name: Markdown lint
        # v24.1.0 bundles markdownlint-cli2 0.23.1 / markdownlint 0.41.1. Keep this
        # in step with the version CLAUDE.md tells a contributor to run locally.
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: "**/*.md"

  adr-guardrail:
    name: ADR/docs guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: ADR/docs hygiene checks
        run: bash scripts/check-adrs.sh
      - name: Decisions index
        # Check 7 above verifies only that every ADR has a row in the reverse index.
        # This verifies what the row says, which is the half no other gate reads:
        # proven on 2026-08-02 by blanking one view from a row's "Views that cite it"
        # cell, on which check-adrs.sh still printed OK and this exited 1.
        run: python3 scripts/check-decisions-index.py
      - name: Guardrail self-test
        # Check 8 uses awk, and this runner's awk is a different implementation from
        # the one it was authored against. A green guardrail on a clean tree proves
        # only that the awk parses: a clean tree has no violation to match. This
        # plants three in a throwaway worktree and asserts they are caught while four
        # look-alikes are not, so the matching is proven on the awk that runs it, on
        # every run rather than once.
        run: bash scripts/test-check-adrs.sh

  editorconfig:
    name: C# style ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the .NET SDK
        # v6.0.0, published 2026-07-16, runtime node24. The node24 fact was read
        # in action.yml at the commit v6.0.0 pointed to on 2026-08-01, which is a
        # weaker guarantee than it was before 2026-08-02: this now names a tag,
        # and a tag can be repointed (ADR-0086 parameter A, and its Consequences
        # say what that costs). v6.0.0 was the latest stable release on 2026-08-02.
        uses: actions/setup-dotnet@v6.0.0
        with:
          # The probe project targets net10.0, which is the pin ADR-0030 sets.
          # `global.json` landed 2026-08-02 and this input is deliberately left as
          # it was. The sentence here used to claim setup-dotnet reads global.json
          # in preference to this input, which was never verified and is now
          # unnecessary to settle: the pin is `10.0.100` with `latestFeature`, so
          # every SDK this input can install already satisfies it. The `build` job
          # below prints the resolved SDK rather than asserting which one wins.
          dotnet-version: "10.0.x"
      - name: Style ruleset self-test
        # There is no C# in this repository yet, so nothing else exercises the
        # ruleset in .editorconfig and Directory.Build.props. This builds a
        # throwaway project against the real ones and asserts that a compliant
        # fixture is clean and a violating fixture fails on all four naming rules
        # plus formatting. Three ways the ruleset can be silently inert were found
        # by measurement while writing it, and each is a live assertion here.
        run: bash scripts/test-editorconfig.sh

  build:
    name: Solution build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Report the resolved SDK
        # Printed rather than assumed. Two things can decide which SDK runs here,
        # the input above and `global.json`, and this is the only place the answer
        # is observable. It is a report, not an assertion: nothing fails on it.
        run: dotnet --version
      - name: Build the solution
        # This step had no teeth until 2026-08-02, when the first project landed,
        # and the note it used to carry is kept in shortened form because the
        # shape recurs: with zero projects an empty solution builds with
        # `warning : Unable to find a project to restore!` and exits 0, so the
        # green covered the SDK pin and the .slnx parse and nothing else.
        #
        # It now reads real C# under the ADR-0065 ruleset, measured: planting a
        # `badlyNamed` private field in the one type this solution contains fails
        # this step with exit 1 on IDE1006.
        #
        # The pin bites too, measured by breaking it both ways. `10.0.999` with
        # `rollForward: disable` fails with exit 155. But `9.0.x` with the same
        # `disable`, which is the form the design corpus writes, exits 0 on a
        # machine carrying no 9.0 SDK at all: a `version` the SDK cannot parse
        # makes the whole `sdk` block inert, so that form is a global.json that
        # pins nothing while reading as a pin.
        run: dotnet build Nami.Identity.slnx --nologo
      - name: Formatting and naming
        # The enforcement path ADR-0065 parameter "CI enforces it" actually names,
        # now pointed at the solution rather than at a fixture. This is NOT the
        # build step under another name and must not be dropped as redundant:
        # `dotnet format` needs no EnforceCodeStyleInBuild, reports whitespace as
        # WHITESPACE rather than IDE0055, and exits 2 rather than 1. Removing
        # either half of the build path's mechanism silences `dotnet build`
        # completely while this one keeps reporting, which is measured and is why
        # scripts/test-editorconfig.sh asserts both.
        #
        # Measured against the same planted violation: exit 2 on IDE1006.
        run: dotnet format Nami.Identity.slnx --verify-no-changes

  # .NET test and license-scan gates are added when the solution carries projects
  # (M1). The `C# style ruleset` job is not one of them: it builds a throwaway
  # fixture to prove a ruleset, and reads no project in this repository. The
  # `build` job above reads the solution but not yet any project, for the reason
  # its own comment gives.
