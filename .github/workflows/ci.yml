name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, never by tag (ADR-0086). The trailing
      # comment is the human-readable version and is not what resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Markdown lint
        # v24.1.0 bundles markdownlint-cli2 0.23.1 / markdownlint 0.41.1. Keep this
        # in step with the version CLAUDE.md tells a contributor to run locally.
        uses: DavidAnson/markdownlint-cli2-action@3b11e4c3e2eac5207914843511bd517908954018 # v24.1.0
        with:
          globs: "**/*.md"

  adr-guardrail:
    name: ADR/docs guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ADR/docs hygiene checks
        run: bash scripts/check-adrs.sh
      - name: Decisions index
        # Check 7 above verifies only that every ADR has a row in the reverse index.
        # This verifies what the row says, which is the half no other gate reads:
        # proven on 2026-08-02 by blanking one view from a row's "Views that cite it"
        # cell, on which check-adrs.sh still printed OK and this exited 1.
        run: python3 scripts/check-decisions-index.py
      - name: Guardrail self-test
        # Check 8 uses awk, and this runner's awk is a different implementation from
        # the one it was authored against. A green guardrail on a clean tree proves
        # only that the awk parses: a clean tree has no violation to match. This
        # plants three in a throwaway worktree and asserts they are caught while four
        # look-alikes are not, so the matching is proven on the awk that runs it, on
        # every run rather than once.
        run: bash scripts/test-check-adrs.sh

  editorconfig:
    name: C# style ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the .NET SDK
        # v6.0.0, published 2026-07-16, runtime node24 (read in action.yml at this
        # exact SHA). Pinned by commit SHA, never by tag (ADR-0086).
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The probe project targets net10.0, which is the pin ADR-0030 sets. The
          # exact SDK pin is that ADR's `global.json` roll-forward and lands at M1
          # with the solution; setup-dotnet reads global.json in preference to this
          # input once the file exists, so the two do not need reconciling here.
          dotnet-version: "10.0.x"
      - name: Style ruleset self-test
        # There is no C# in this repository yet, so nothing else exercises the
        # ruleset in .editorconfig and Directory.Build.props. This builds a
        # throwaway project against the real ones and asserts that a compliant
        # fixture is clean and a violating fixture fails on all four naming rules
        # plus formatting. Three ways the ruleset can be silently inert were found
        # by measurement while writing it, and each is a live assertion here.
        run: bash scripts/test-editorconfig.sh

  # .NET build/test/license-scan gates are added when the solution lands (M1).
  # The job above is not one of them: it builds a throwaway fixture to prove a
  # ruleset, and reads no project in this repository, because there are none.
